name: Release

# Push a tag like v0.2.0 (matching the VERSION file) to build and publish a release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        run: |
          V=$(cat VERSION)
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$V" ]]; then
            echo "Tag $GITHUB_REF_NAME doesn't match VERSION $V"; exit 1
          fi

      - name: Test
        run: swift test

      # Optional: Developer ID signing + notarization, enabled when these secrets exist:
      # MACOS_CERTIFICATE_P12 (base64), MACOS_CERTIFICATE_PASSWORD, MACOS_SIGN_ID,
      # NOTARY_APPLE_ID, NOTARY_TEAM_ID, NOTARY_PASSWORD (app-specific password).
      - name: Import signing certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p ci "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p ci "$KEYCHAIN"
          echo "$P12" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')

      - name: Build (universal)
        env:
          BABELPEN_UNIVERSAL: "1"
          BABELPEN_SIGN_ID: ${{ secrets.MACOS_SIGN_ID || '-' }}
          BABELPEN_HARDENED: ${{ env.HAS_SIGNING == 'true' && '1' || '0' }}
        run: ./build.sh && lipo -archs Babelpen.app/Contents/MacOS/Babelpen

      - name: Notarize
        if: env.HAS_SIGNING == 'true'
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: |
          ditto -c -k --keepParent Babelpen.app notarize.zip
          xcrun notarytool submit notarize.zip --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait
          xcrun stapler staple Babelpen.app

      - name: Package
        run: ./scripts/package.sh

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V=$(cat VERSION)
          ./scripts/release-notes.sh "$V" > notes.md
          cat >> notes.md <<'NOTES'

          ### Install
          ```bash
          curl -fsSL https://raw.githubusercontent.com/AllanLotta/babelpen/main/install.sh | bash
          ```
          Or download the `.dmg`, drag Babelpen to Applications, and allow Accessibility access on first launch.
          NOTES
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release upload "v$V" dist/* --clobber
          else
            gh release create "v$V" dist/* --title "Babelpen $V" --notes-file notes.md
          fi
