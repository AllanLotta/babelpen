<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Babelpen demo: chat</title>
<style>
  :root { --bg:#1a1d21; --side:#19171d; --line:#2c2f34; --text:#d1d2d3; --muted:#9a9b9e; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; font:15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--text); }
  aside { width:220px; background:var(--side); border-right:1px solid var(--line); padding:18px 12px; }
  aside h1 { font-size:17px; margin:0 8px 18px; color:#fff; }
  aside .item { padding:5px 10px; border-radius:6px; color:var(--muted); }
  aside .item.on { background:#1164a3; color:#fff; }
  main { flex:1; display:flex; flex-direction:column; min-width:0; }
  header { padding:14px 20px; border-bottom:1px solid var(--line); font-weight:700; color:#fff; }
  .msgs { flex:1; padding:16px 20px; overflow:hidden; display:flex; flex-direction:column; justify-content:flex-end; gap:14px; }
  .msg { display:flex; gap:10px; }
  .av { width:36px; height:36px; border-radius:8px; flex:none; display:grid; place-items:center; font-weight:700; color:#fff; }
  .who { font-weight:700; color:#fff; } .who span { font-weight:400; color:var(--muted); font-size:12px; margin-left:6px; }
  .composer { margin:0 20px 20px; border:1px solid #565856; border-radius:10px; padding:10px 12px; }
  textarea { width:100%; border:0; outline:0; resize:none; background:transparent; color:var(--text); font:inherit; height:48px; }
  .hint { color:var(--muted); font-size:12px; }
</style>
</head>
<body>
<aside>
  <h1>Acme Inc.</h1>
  <div class="item">#announcements</div>
  <div class="item on">#global-team</div>
  <div class="item">#design</div>
  <div class="item">#random</div>
</aside>
<main>
  <header># global-team</header>
  <div class="msgs" id="msgs">
    <div class="msg"><div class="av" style="background:#e8912d">M</div><div><div class="who">Maya<span>10:42</span></div>Morning! How's the onboarding redesign going?</div></div>
  </div>
  <div class="composer">
    <textarea id="box" placeholder="Message #global-team"></textarea>
    <div class="hint">Return to send</div>
  </div>
</main>
<script>
  // Types messages like a person would; when Babelpen replaces the text, the
  // message is "sent" and the next one starts. Used to record the README demo.
  const params = new URLSearchParams(location.search);
  const messages = params.getAll('text').length ? params.getAll('text') : [
    "i didnt had time to review the PR yet, i will do it tomorow",
    "mañana revisamos el diseño, creo que hay que cambiar algunas cosa antes de lanzar",
    "je suis d'accord, on peux faire la démo vendredi",
  ];
  const box = document.getElementById('box');
  const list = document.getElementById('msgs');
  box.focus();

  function send(text) {
    const row = document.createElement('div');
    row.className = 'msg';
    row.innerHTML = '<div class="av" style="background:#7c5cff">Y</div><div><div class="who">You<span>10:4' +
      (5 + list.children.length) + '</span></div></div>';
    row.lastChild.appendChild(document.createTextNode(text));
    list.appendChild(row);
    box.value = '';
  }

  function typeMessage(index) {
    if (index >= messages.length) return;
    const text = messages[index];
    let i = 0;
    (function type() {
      if (i < text.length) {
        box.value += text[i++];
        box.selectionStart = box.selectionEnd = box.value.length;
        setTimeout(type, 28 + Math.random() * 40);
        return;
      }
      // Wait for the fix to be applied (or give up after 12 s), then send.
      const started = Date.now();
      (function wait() {
        if (box.value !== text || Date.now() - started > 12000) {
          setTimeout(() => { send(box.value); setTimeout(() => typeMessage(index + 1), 700); }, 900);
        } else setTimeout(wait, 150);
      })();
    })();
  }
  setTimeout(() => typeMessage(0), +(params.get('delay') || 1200));
</script>
</body>
</html>
