<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Revisor demo: email</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:grid; place-items:center; background:#202124; font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color:#e8eaed; }
  .win { width:min(760px, 94vw); background:#2d2e30; border-radius:12px; overflow:hidden; box-shadow:0 10px 40px #0008; }
  .bar { background:#404144; padding:10px 16px; font-weight:600; }
  .row { padding:9px 16px; border-bottom:1px solid #3c4043; color:#bdc1c6; }
  .row b { color:#e8eaed; font-weight:500; }
  .body { padding:16px; min-height:260px; outline:0; white-space:pre-wrap; }
  .foot { padding:12px 16px; } .send { background:#8ab4f8; color:#202124; border-radius:18px; padding:8px 22px; font-weight:600; display:inline-block; }
</style>
</head>
<body>
<div class="win">
  <div class="bar">New message</div>
  <div class="row">To <b>maya@example.com</b></div>
  <div class="row">Subject <b>Onboarding proposal</b></div>
  <div class="body" id="body" contenteditable="true"></div>
  <div class="foot"><span class="send">Send</span></div>
</div>
<script>
  const text = new URLSearchParams(location.search).get('text') ||
    "Hi Maya,\n\nThanks for the quick reply. Me and the team reviewed the proposal and we think it make sense to move forward next week. Let me know if you has any question.\n\nBest,\nSam";
  const body = document.getElementById('body');
  body.focus();
  const instant = new URLSearchParams(location.search).has('instant');
  function caretToEnd() {
    const r = document.createRange(); r.selectNodeContents(body); r.collapse(false);
    const s = getSelection(); s.removeAllRanges(); s.addRange(r);
  }
  if (instant) { body.textContent = text; caretToEnd(); }
  else {
    let i = 0;
    setTimeout(function type() {
      if (i >= text.length) return;
      body.textContent += text[i++]; caretToEnd();
      setTimeout(type, 22 + Math.random() * 30);
    }, 1000);
  }
</script>
</body>
</html>
